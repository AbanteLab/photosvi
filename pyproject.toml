[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photosvi"
dynamic = ["version"]
description = "Transient detection and drug-response rate estimation for fiber photometry, from one generative model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Peytral", email = "gpeytralborja@gmail.com" },
    { name = "Zinnera Tariq" },
    { name = "Amelie Essmann" },
    { name = "Zelai M. Garçon-Poca" },
    { name = "David Garcia Ortiz" },
    { name = "Caitlin Crook" },
    { name = "Jordi Bonaventura" },
    { name = "Jordi Abante" },
]
keywords = ["fiber-photometry", "point-process", "dopamine", "pyro", "variational-inference", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "pyro-ppl>=1.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "h5py>=3.0",                # Doric .doric files (photosvi fit, api.load_doric_session)
]

[project.optional-dependencies]
# The interactive benchmark views (`BenchmarkResult.pr_figure()`, `.dashboard()`).
plots = ["plotly>=5.0"]
dev = [
    "plotly>=5.0",
    "build",
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.4",
    # 3.10 has no tomllib; tests/test_cli.py reads pyproject.toml to check the
    # console script really resolves.
    "tomli>=2; python_version < '3.11'",
]
# Documentation. The API pages are generated from the docstrings by mkdocstrings,
# so there is no second copy of them to keep in step.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    # pymdown-extensions 12.2 made `md` a required argument of Highlight; the last
    # mkdocstrings that installs on 3.10 (1.0.6) still constructs it without one.
    "pymdown-extensions<12.2; python_version < '3.11'",
]

[project.scripts]
photosvi = "photosvi.cli.main:main"

[project.urls]
Homepage = "https://github.com/AbanteLab/photosvi"
Documentation = "https://abantelab.github.io/photosvi/"
Preprint = "https://doi.org/10.64898/2026.11.16.767032"

[tool.setuptools.dynamic]
version = { attr = "photosvi.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The shipped configs, which carry the model's defaults (api.PRODUCTION_CONFIG) and the
# settings of every study in the paper.
[tool.setuptools.package-data]
photosvi = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E501: long lines tolerated; E702: `a = x; b = y` is a deliberate style here
ignore = ["E501", "E702"]

[tool.pytest.ini_options]
