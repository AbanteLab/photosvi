# Build the package and upload it to PyPI when a release is published on GitHub.
#
# Uses PyPI's trusted publishing, so there is no token in the repository: PyPI is told
# once (project settings, "Publishing") to accept uploads from this workflow in this
# repository, under the environment `pypi`. The version uploaded is
# `photosvi.__version__`; the release tag must match it, or the job stops.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: The tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/photosvi/__init__.py').read())[1])")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - name: Install the wheel and run the examples outside the source tree
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install dist/*.whl
          cp docs/examples/*.py /tmp/
          cd /tmp
          python single_trace.py
          python cohort.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  upload:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the OIDC token trusted publishing exchanges for an upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
