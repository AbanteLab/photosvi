# The AR(2) 2x2 again at the CALIBRATED noise level (sigma_y 1.5, not 0.1062),
# where the noise is larger than the transients. The earlier run was in a regime
# the recordings do not occupy; this one asks whether recovery survives the real
# one. Same trimmed setup otherwise.

