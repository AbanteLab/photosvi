# K9 with a TWO-POLE emission, 2026-09-30. Same trimmed setup as the other
# k9_ident_* configs: T is 12 min, one arm (`cat`), three seeds, 6000 steps on CPU.
#
# The coefficients are NOT invented. Yule-Walker on the two raw .doric recordings
# gives an AR(2) whose poles sit at about 2.044 s and 0.054 s, and that pair
# reproduces the lag-one correlation of the trace's differences almost exactly
# (+0.672 against +0.677 measured, where any AR(1) gives -0.004). Converted to the
# simulator's 25 Hz, phi = [1.45738, -0.46752].
#
# Why two poles at all: the recordings carry two timescales, one near 2 s and one
# near 50 ms, and an AR(1) has only one pole to spend. Fitted to the data it spends
# it on the slow one and leaves the trace as jagged as white noise.
#
# The open question these runs answer: the slow pole is ~2 s and a transient is
# ~0.65 s wide, so the coloured noise now moves on the same timescale as the thing
# being counted. Whether the estimand survives that is not something to assume.
# THIS CONFIG: gen AR(2), fit white -- what we do today.

name: k9_ar2_gen_white_fit
grid:
  arms:
  - cat
  seeds:
  - 0
  - 1
  - 2
data:
  fs: 25
  T: 18000
  inj_t: 6000
gt:
  beta0: -2.8539
  beta_inj: 1.0201
  sigma_y: 0.1062
  mu_a: 1.7666
  sigma_a: 0.212
tonic:
  b: -0.3406
  peak: 7.967771248061421
  k_rise: 0.0018
  k_decay: 0.0001
  drift: -7.920000000000001
kernel:
  length: 200
  fit:
    family: bigamma
    shape_fast: 20.34
    rate_fast: 15.65
    shape_slow: 15.4
    rate_slow: 3.95
fit:
  steps: 6000
  probe: 500
  lr: 0.01
  stop_probe: 1000
  stop_tol: 0.02
  stop_window: 4
  stop_min_steps: 3000
  max_steps: 6000
  tau: 0.2
  beta0_prior_scale: 3.0
  beta_inj_prior_loc: 0.0
  beta_inj_prior_scale: 2.0
  beta_prior: normal
  beta_guide: fullrank
  beta0_halfwidth: 5.0
  beta_inj_halfwidth: 4.0
warm:
  thresh: 2.5
  gain: 2.0
  hi: 6.0
  floor: -6.0
heldout:
  steps: 40
  every: 4
  lr: 0.005
  seed_offset: 1000
detection:
  tol_s: 0.35
  refractory: 8
  thresh: 0.5
  mf_thresh: 2.5
emission:
  ar_coeffs:
  - 1.45738
  - -0.46752
  fit_ar_coeffs: []
